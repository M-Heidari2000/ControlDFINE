seed: 173
log_dir: "./log"
notes: "swiss_roll"
run_name: "DFINE"

data:
  test_ratio: 0.2
  num_episodes: 10000
  action_repeat: 1
  dist: uniform  # env, normal, or uniform
  u_std: 0.3   # std for normal dist
  u_max: 0.5   # range for uniform dist [-u_max, u_max]

env:
  name: swiss_roll
  horizon: 100
  periodic: False

  A:
    - [0.1552603542804718, -0.9802759289741516]
    - [0.9802759289741516, 0.1552603542804718]
  B:
    - [3.0, 0.0]
    - [0.0, 3.0]
  Ns:
    - [0.01, 0.0]
    - [0.0, 0.01]
  "No":
    - [0.01, 0.0, 0.0]
    - [0.0, 0.01, 0.0]
    - [0.0, 0.0, 0.01]

train:
  backbone:
    num_updates: 5000
    test_interval: 10
    x_dim: 2
    a_dim: 2
    hidden_dim: 128
    min_var: 1e-2
    locally_linear: False
    chunk_length: 32
    prediction_k: 8
    batch_size: 512
    lr: 5e-3
    eps: 1e-8
    weight_decay: 1e-6
    clip_grad_norm: 1.0
    disable_gpu: False
    filtering_weight: 1.0
    mean_consistency_weight: 0.0
    kl_consistency_weight: 0.1
    kl_free_nats: 1.0
    sigreg_weight: 0.05
    sigreg_knots: 17
    sigreg_num_proj: 256
    gramian_weight: 0.1
  cost:
    num_updates: 250
    test_interval: 10
    chunk_length: 48
    batch_size: 128
    lr: 1e-2
    eps: 1e-8
    weight_decay: 1e-6
    clip_grad_norm: 1.0
    disable_gpu: False

evaluation:
  num_points: 1
  num_regions: 1
  deterministic: True
  planning_horizon: 8