seed: 0
log_dir: "./log"
notes: "torus"
run_name: "DFINE"

data:
  test_ratio: 0.2
  num_episodes: 10000
  action_repeat: 1
  dist: uniform  # env, normal, or uniform
  u_std: 0.3   # std for normal dist
  u_max: 0.3   # range for uniform dist [-u_max, u_max]

env:
  name: torus
  horizon: 100
  periodic: False
  radius1: 1.0
  radius2: 4.0
  rotated: False

  A:
    - [0.0, 0.8]
    - [1.0, 0.0]
  B:
    - [3.0, 0.0]
    - [0.0, 3.0]
  Ns:
    - [0.0001, 0.0]
    - [0.0, 0.0001]
  "No":
    - [0.0001, 0.0, 0.0]
    - [0.0, 0.0001, 0.0]
    - [0.0, 0.0, 0.0001]

train:
  backbone:
    num_updates: 10000
    test_interval: 10
    x_dim: 2
    a_dim: 2
    hidden_dim: 128
    min_var: 1e-3
    locally_linear: False
    chunk_length: 48
    prediction_k: 4
    batch_size: 256
    lr: 5e-3
    eps: 1e-8
    weight_decay: 1e-6
    clip_grad_norm: 1.0
    disable_gpu: False
    filtering_weight: 1.0
    mean_consistency_weight: 0.0
    kl_consistency_weight: 0.0
    kl_free_nats: 0.0
    sigreg_weight: 0.05
    sigreg_knots: 17
    sigreg_num_proj: 256
    gramian_weight: 0.0
  cost:
    num_updates: 250
    test_interval: 10
    chunk_length: 48
    batch_size: 256
    lr: 1e-2
    eps: 1e-8
    weight_decay: 1e-6
    clip_grad_norm: 1.0
    disable_gpu: False

evaluation:
  num_points: 1
  num_regions: 1
  deterministic: True
  planning_horizon: 8