seed: 0
log_dir: "./log"
notes: "pendulum"
run_name: "DFINE"

data:
  test_ratio: 0.2
  data_dir: "/home/heidaris/workspace/offline_data/pendulum"

env:
  name: pendulum
  horizon: 200
  gravity: 10.0
  action_repeat: 2

train:
  backbone:
    num_updates: 2001
    test_interval: 2000
    x_dim: 3
    a_dim: 3
    hidden_dim: 128
    min_var: 1e-2
    max_var: 1.0
    locally_linear: True
    chunk_length: 48
    prediction_k: 16
    batch_size: 256
    lr: 3e-4
    eps: 1e-8
    weight_decay: 1e-6
    clip_grad_norm: 1.0
    disable_gpu: False
    filtering_weight: 0.1
    mean_consistency_weight: 0.0
    kl_consistency_weight: 0.0
    kl_free_nats: 0.0
    sigreg_weight: 0.1
    sigreg_knots: 17
    sigreg_num_proj: 1024
    gramian_weight: 0.0
  cost:
    num_updates: 2500
    test_interval: 10
    chunk_length: 32
    batch_size: 256
    lr: 3e-3
    eps: 1e-8
    weight_decay: 1e-6
    clip_grad_norm: 1.0
    disable_gpu: False
  evaluation:
    num_trials: 5
    planning_horizon: 8
    num_iterations: 10